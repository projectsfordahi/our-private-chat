<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Private Lounge</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #efeae2; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #ffffff; gap: 15px; padding: 20px; text-align: center; }
        #setup h2 { color: #075e54; font-size: 1.6rem; }
        #setup input { padding: 14px; width: 280px; border: 2px solid #e0e0e0; border-radius: 25px; font-size: 1rem; text-align: center; outline: none; }
        #setup button { padding: 12px 30px; background: #00a884; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 1rem; }

        #chat-window { display: none; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 16px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        
        .sync-tray { background: #f0f2f5; padding: 10px 16px; display: flex; gap: 10px; border-bottom: 1px solid #ddd; align-items: center; }
        .sync-tray input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
        .sync-btn { background: #0288d1; color: white; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
        
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 75%; padding: 8px 14px; border-radius: 12px; font-size: 1rem; word-wrap: break-word; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
        .sender-tag { font-size: 0.75rem; color: #8696a0; margin-bottom: 4px; font-weight: bold; text-transform: capitalize; }
        
        .me { background-color: #d9fdd3; align-self: flex-end; border-top-right-radius: 0px; }
        .them { background-color: #ffffff; align-self: flex-start; border-top-left-radius: 0px; }

        footer { background: #f0f2f5; padding: 12px 16px; display: flex; gap: 12px; align-items: center; border-top: 1px solid #e3e3e3; }
        footer input { flex: 1; padding: 12px 18px; border: 1px solid #ffffff; border-radius: 25px; outline: none; font-size: 1rem; }
        footer button { background: #00a884; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    </style>
</head>
<body>

    <div id="setup">
        <h2>Enter Your Name</h2>
        <input type="text" id="username" placeholder="Type your name...">
        <button onclick="startChat()">Enter Lounge</button>
    </div>

    <div id="chat-window">
        <header>Our Private Lounge</header>
        
        <div class="sync-tray">
            <input type="text" id="sync-input" placeholder="Paste pure numbers here...">
            <button class="sync-btn" onclick="importIntToken()">Update Chat</button>
            <button class="sync-btn" style="background:#00a884;" onclick="copyMyIntToken()">Copy Token</button>
        </div>

        <div id="messages"></div>
        <footer>
            <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') send()">
            <button onclick="send()">➔</button>
        </footer>
    </div>

    <script>
        let myName = localStorage.getItem("lounge_user_name") || "";
        let chatHistory = [];
        
        // Static dictionary grid converts letters to small compressed number codes
        const dict = [" ","a","b","c","d","e","f","g","h","i","j","k","l","m","n","o","p","q","r","s","t","u","v","w","x","y","z","1","2","3","4","5","6","7","8","9","0",".",",","?","!","'",'"',"-","_",":",";","@"];

        function startChat() {
            const nameInput = document.getElementById("username").value.trim();
            if(!nameInput) return alert("Please type your name!");
            
            myName = nameInput.toLowerCase();
            localStorage.setItem("lounge_user_name", myName);
            
            document.getElementById("setup").style.display = "none";
            document.getElementById("chat-window").style.display = "flex";
            document.getElementById("message-input").focus();

            renderChatBubbles();
        }

        function send() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if(!text) return;

            chatHistory.push({ s: myName === 'user' || myName.startsWith('u') ? 1 : 2, m: text });
            renderChatBubbles();

            input.value = "";
            input.focus();
        }

        function renderChatBubbles() {
            const msgArea = document.getElementById("messages");
            msgArea.innerHTML = "";

            chatHistory.forEach(msg => {
                const bubble = document.createElement("div");
                bubble.classList.add("msg");
                
                const senderName = msg.s === 1 ? "User" : "Partner";
                if((msg.s === 1 && (myName === 'user' || myName.startsWith('u'))) || (msg.s === 2 && !(myName === 'user' || myName.startsWith('u')))) {
                    bubble.classList.add("me");
                } else {
                    bubble.classList.add("them");
                }
                
                const nameSpan = document.createElement("span");
                nameSpan.classList.add("sender-tag");
                nameSpan.textContent = senderName;
                
                const textNode = document.createTextNode(msg.m);
                bubble.appendChild(nameSpan);
                bubble.appendChild(textNode);
                msgArea.appendChild(bubble);
            });
            msgArea.scrollTop = msgArea.scrollHeight;
        }

        // Encodes standard text message letters down into tiny integer lists
        function copyMyIntToken() {
            let outputInts = [];
            chatHistory.forEach(chat => {
                outputInts.push(chat.s); // 1 digit for sender tracking
                let characters = chat.m.toLowerCase().split('');
                characters.forEach(char => {
                    let idx = dict.indexOf(char);
                    if(idx !== -1) outputInts.push(idx);
                });
                outputInts.push(99); // 99 blocks mark the end of a single chat bubble text
            });

            const shortStringToken = outputInts.join("-");
            navigator.clipboard.writeText(shortStringToken).then(() => {
                alert("Tiny numbers code copied! Paste directly into her text window.");
            }).catch(() => {
                alert("Copy failed. Manually save code line: " + shortStringToken);
            });
        }

        // Decodes the short array of integers back into text bubbles
        function importIntToken() {
            const tokenInput = document.getElementById("sync-input");
            const rawToken = tokenInput.value.trim();
            if (!rawToken) return alert("Please paste the numbers line token first!");

            try {
                let codeArray = rawToken.split("-").map(Number);
                let loadedHistory = [];
                let currentSender = null;
                let currentMessageChars = [];

                for (let i = 0; i < codeArray.length; i++) {
                    let code = codeArray[i];
                    if (currentSender === null) {
                        currentSender = code;
                    } else if (code === 99) {
                        loadedHistory.push({ s: currentSender, m: currentMessageChars.join('') });
                        currentSender = null;
                        currentMessageChars = [];
                    } else {
                        if (dict[code]) currentMessageChars.push(dict[code]);
                    }
                }

                chatHistory = loadedHistory;
                renderChatBubbles();
                tokenInput.value = "";
                alert("Conversation parsed and synced!");
            } catch(e) {
                alert("Numbers matching alignment error. Make sure you copied correctly.");
            }
        }

        window.onload = function() {
            if (myName) {
                document.getElementById("username").value = myName;
                startChat();
            }
        };
    </script>
</body>
</html>
